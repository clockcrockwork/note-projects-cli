name: Cleanup ART-012 legacy previews

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleanup-art012-legacy-previews
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: private-source-read
    steps:
      - name: Delete only the three recorded legacy ART-012 deployments
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_VXDwElBdF8kzJnYTyFFcDupn
          VERCEL_PROJECT_ID: prj_9isVYTEK3CtFoYo70nEa2NcH1Noq
          VERCEL_PROJECT_NAME: note-projects-publication-preview
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.VERCEL_TOKEN
          const teamId = process.env.VERCEL_TEAM_ID
          const expectedProjectId = process.env.VERCEL_PROJECT_ID
          const expectedProjectName = process.env.VERCEL_PROJECT_NAME
          if (!token || !teamId || !expectedProjectId || !expectedProjectName) {
            throw new Error('CLEANUP_CREDENTIALS_OR_IDENTITY_MISSING')
          }

          const ids = [
            'dpl_8VLu1yoZifxFU2SJqy5V135ZCiBZ',
            'dpl_3YexkftvCq8upA2ezJzPVRc9EYFM',
            'dpl_3x9p8aHxmo3WiK1c6jFZNVFci7F2',
          ]
          const base = 'https://api.vercel.com'
          const headers = { Authorization: `Bearer ${token}` }

          async function fetchDeployment(id) {
            return fetch(`${base}/v13/deployments/${encodeURIComponent(id)}?teamId=${encodeURIComponent(teamId)}`, {
              headers,
              redirect: 'error',
            })
          }

          for (const id of ids) {
            const probe = await fetchDeployment(id)
            if (probe.status === 404) {
              console.log(`already-absent ${id}`)
              continue
            }
            if (!probe.ok) throw new Error(`CLEANUP_PROBE_HTTP_${probe.status}_${id}`)
            const deployment = await probe.json()
            const actualId = deployment?.id ?? deployment?.uid
            const actualProjectId = deployment?.projectId ?? deployment?.project?.id
            const actualProjectName = deployment?.name ?? deployment?.project?.name
            if (actualId !== id) throw new Error(`CLEANUP_DEPLOYMENT_ID_MISMATCH_${id}`)
            if (actualProjectId !== expectedProjectId) {
              throw new Error(`CLEANUP_PROJECT_ID_MISMATCH_${id}`)
            }
            if (actualProjectName !== expectedProjectName) {
              throw new Error(`CLEANUP_PROJECT_NAME_MISMATCH_${id}`)
            }

            const removed = await fetch(`${base}/v13/deployments/${encodeURIComponent(id)}?teamId=${encodeURIComponent(teamId)}`, {
              method: 'DELETE',
              headers,
              redirect: 'error',
            })
            if (!removed.ok) throw new Error(`CLEANUP_DELETE_HTTP_${removed.status}_${id}`)

            const confirm = await fetchDeployment(id)
            if (confirm.status !== 404) {
              throw new Error(`CLEANUP_DELETE_NOT_CONFIRMED_${id}_${confirm.status}`)
            }
            console.log(`deleted ${id}`)
          }
          NODE
