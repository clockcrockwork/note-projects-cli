name: Typed remote run

on:
  issues:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: remote-run-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      request_json: ${{ steps.parse.outputs.request_json }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: ''
      - id: parse
        shell: bash
        run: |
          set -euo pipefail
          request_json="$(node scripts/parse-request.mjs "$GITHUB_EVENT_PATH")"
          printf 'request_json=%s\n' "$request_json" >> "$GITHUB_OUTPUT"

  repository_verify:
    needs: authorize
    if: ${{ needs.authorize.result == 'success' && fromJSON(needs.authorize.outputs.request_json).task == 'repository-verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: private-source-read
    permissions:
      contents: read
    outputs:
      result_json: ${{ steps.run.outputs.result_json }}
      source_sha: ${{ steps.run.outputs.source_sha }}
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: ''
      - id: run
        continue-on-error: true
        env:
          REQUEST_JSON: ${{ needs.authorize.outputs.request_json }}
          NPR_APP_ID: ${{ secrets.NPR_APP_ID }}
          NPR_APP_PRIVATE_KEY: ${{ secrets.NPR_APP_PRIVATE_KEY }}
          NPR_APP_INSTALLATION_ID: ${{ secrets.NPR_APP_INSTALLATION_ID }}
        run: node scripts/run-repository-verify.mjs
      - name: preserve task failure
        if: ${{ steps.run.outcome == 'failure' }}
        shell: bash
        run: exit 1

  report_repository_verify:
    needs: [authorize, repository_verify]
    if: ${{ always() && needs.authorize.result == 'success' && fromJSON(needs.authorize.outputs.request_json).task == 'repository-verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: ''
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT_JSON: ${{ needs.repository_verify.outputs.result_json }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/report-result.mjs

  publication_preview:
    needs: authorize
    if: ${{ needs.authorize.result == 'success' && fromJSON(needs.authorize.outputs.request_json).task == 'publication-preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: private-source-read
    permissions:
      contents: read
    outputs:
      result_json: ${{ steps.run.outputs.result_json }}
      source_sha: ${{ steps.run.outputs.source_sha }}
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: ''
      - id: run
        continue-on-error: true
        env:
          REQUEST_JSON: ${{ needs.authorize.outputs.request_json }}
          NPR_APP_ID: ${{ secrets.NPR_APP_ID }}
          NPR_APP_PRIVATE_KEY: ${{ secrets.NPR_APP_PRIVATE_KEY }}
          NPR_APP_INSTALLATION_ID: ${{ secrets.NPR_APP_INSTALLATION_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_VXDwElBdF8kzJnYTyFFcDupn
        run: node scripts/run-publication-preview.mjs
      - name: preserve task failure
        if: ${{ steps.run.outcome == 'failure' }}
        shell: bash
        run: exit 1

  report_publication_preview:
    needs: [authorize, publication_preview]
    if: ${{ always() && needs.authorize.result == 'success' && fromJSON(needs.authorize.outputs.request_json).task == 'publication-preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: ''
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT_JSON: ${{ needs.publication_preview.outputs.result_json }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/report-publication-preview-result.mjs

  unactivated_typed_task:
    needs: authorize
    if: ${{ needs.authorize.result == 'success' && fromJSON(needs.authorize.outputs.request_json).task != 'repository-verify' && fromJSON(needs.authorize.outputs.request_json).task != 'publication-preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - shell: bash
        run: |
          echo 'HOLD: TYPED_TASK_NOT_ACTIVATED'
          exit 3
