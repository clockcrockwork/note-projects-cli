name: Patreon cover render

on:
  workflow_dispatch:
    inputs:
      target:
        description: Declared PTN-COVER-* target from the private Patreon render manifest
        required: true
        type: string
      source:
        description: Private Patreon source revision
        required: true
        default: main
        type: choice
        options:
          - main
          - pull_request
      pull_request:
        description: Numeric Patreon PR number when source=pull_request
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - requests/patreon-cover-render.json

permissions: {}

concurrency:
  group: patreon-cover-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  render:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: private-source-read
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: ''
      - id: request
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          SOURCE: ${{ inputs.source }}
          PR: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            request_json="$(node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const raw = JSON.parse(fs.readFileSync('requests/patreon-cover-render.json', 'utf8'))
          if (!raw || typeof raw.target !== 'string' || !/^PTN-COVER-[A-Z0-9-]+$/.test(raw.target)) {
            console.error('REQUEST_TARGET_INVALID')
            process.exit(2)
          }
          const keys = Object.keys(raw).sort()
          if (keys.length !== 1 || keys[0] !== 'target') {
            console.error('REQUEST_SHAPE_INVALID')
            process.exit(2)
          }
          process.stdout.write(JSON.stringify({
            task: 'patreon-cover-render',
            target: raw.target,
            source: 'main',
            pull_request: null,
          }))
          NODE
            )"
            printf 'request_json=%s\n' "$request_json" >> "$GITHUB_OUTPUT"
            printf 'source=main\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$TARGET" =~ ^PTN-COVER-[A-Z0-9-]+$ ]]; then
            echo 'REQUEST_TARGET_INVALID' >&2
            exit 2
          fi
          if [[ "$SOURCE" == 'main' ]]; then
            if [[ -n "$PR" ]]; then
              echo 'REQUEST_PR_NOT_ALLOWED' >&2
              exit 2
            fi
            pr_json='null'
          elif [[ "$SOURCE" == 'pull_request' ]]; then
            if [[ ! "$PR" =~ ^[1-9][0-9]*$ ]]; then
              echo 'REQUEST_PR_INVALID' >&2
              exit 2
            fi
            pr_json="$PR"
          else
            echo 'REQUEST_SOURCE_INVALID' >&2
            exit 2
          fi
          request_json="$(printf '{"task":"patreon-cover-render","target":"%s","source":"%s","pull_request":%s}' "$TARGET" "$SOURCE" "$pr_json")"
          printf 'request_json=%s\n' "$request_json" >> "$GITHUB_OUTPUT"
          printf 'source=%s\n' "$SOURCE" >> "$GITHUB_OUTPUT"
      - id: run
        continue-on-error: true
        env:
          REQUEST_JSON: ${{ steps.request.outputs.request_json }}
          NPR_APP_ID: ${{ secrets.NPR_APP_ID }}
          NPR_APP_PRIVATE_KEY: ${{ secrets.NPR_APP_PRIVATE_KEY }}
          NPR_APP_INSTALLATION_ID: ${{ secrets.NPR_APP_INSTALLATION_ID }}
        run: node scripts/run-patreon-cover-render.mjs
      - name: Upload publication-safe cover artifact
        if: ${{ always() && steps.run.outputs.artifact_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          path: ${{ steps.run.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
      - id: publish
        name: Publish mobile-downloadable cover previews
        if: ${{ steps.run.outcome == 'success' && steps.request.outputs.source == 'main' && steps.run.outputs.artifact_path != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATH: ${{ steps.run.outputs.artifact_path }}
          RELEASE_TAG: patreon-cover-previews
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Patreon cover previews" \
              --notes "Publication-safe Patreon cover outputs from the qualified public renderer. Download the 1920x1080 PNG for Patreon; 320x180 and 240x135 are QA sizes." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$RELEASE_TAG" "$ARTIFACT_PATH"/*.png --clobber
          printf 'release_url=%s\n' "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: ${{ always() }}
        shell: bash
        env:
          RESULT_JSON: ${{ steps.run.outputs.result_json }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
        run: |
          printf '### Patreon cover render\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$RESULT_JSON" ]]; then
            printf '`%s`\n' "$RESULT_JSON" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '`PATREON_COVER_RENDER_NO_RESULT`\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$RELEASE_URL" ]]; then
            printf '\nMobile/download handoff: %s\n' "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve task failure
        if: ${{ steps.run.outcome == 'failure' }}
        shell: bash
        run: exit 1
